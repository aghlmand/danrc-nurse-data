name: Update nurse data (/nurse)

on:
  schedule:
    # GitHub often delays or drops scheduled runs, so there are many tries spread over the night.
    # Every run after the first successful one skips in a few seconds (see the chk step).
    - cron: '43 20 * * *'  # 00:13 Tehran (first try of the new Tehran day)
    - cron: '17 22 * * *'  # 01:47 Tehran (main)
    - cron: '53 22 * * *'  # 02:23 Tehran
    - cron: '29 23 * * *'  # 02:59 Tehran
    - cron: '7 0 * * *'    # 03:37 Tehran
    - cron: '47 0 * * *'   # 04:17 Tehran
    - cron: '23 1 * * *'   # 04:53 Tehran
    - cron: '59 1 * * *'   # 05:29 Tehran
    - cron: '41 2 * * *'   # 06:11 Tehran
    - cron: '13 3 * * *'   # 06:43 Tehran
    - cron: '47 3 * * *'   # 07:17 Tehran
    - cron: '19 4 * * *'   # 07:49 Tehran (last try)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip if today's data already exists (manual runs always update)
        id: chk
        run: |
          TODAY=$(TZ=Asia/Tehran date +%F)
          DAY=$(node -e "try{console.log(require('./data/summary.json').day||'')}catch(e){console.log('')}")
          echo "today=$TODAY data=$DAY event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$DAY" = "$TODAY" ]; then echo "skip=true" >> $GITHUB_OUTPUT; echo "Already updated today - skipping"; else echo "skip=false" >> $GITHUB_OUTPUT; fi
      - name: Nurse data
        if: steps.chk.outputs.skip != 'true'
        run: node scripts/update.mjs
      - name: Salary sample (stated salaries in new ads)
        if: always() && steps.chk.outputs.skip != 'true'
        run: node scripts/salary.mjs nurse
      - name: Daily statistics
        if: always() && steps.chk.outputs.skip != 'true'
        run: node scripts/stats.mjs nurse
      # always commit what was written (failed items keep yesterday's data); a red step above still e-mails the owner
      - name: Commit data
        if: always() && steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "danrc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "nurse data: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 15; done
