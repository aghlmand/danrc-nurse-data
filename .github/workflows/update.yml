name: Update nurse job data

on:
  schedule:
    - cron: '30 2 * * *'   # every day 02:30 UTC (06:00 Tehran)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - run: node scripts/update-jobs.mjs
      - name: Commit data
        run: |
          git config user.name "danrc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
