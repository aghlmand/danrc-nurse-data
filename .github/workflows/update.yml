name: Update nurse job data

on:
  schedule:
    - cron: '30 23 * * *'  # every day 23:30 UTC = 03:00 Tehran (UTC+3:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Nurse data
        run: node scripts/update.mjs
      - name: Jobs data
        if: always()
        run: node scripts/update-jobs.mjs
      - name: Ausbildung data
        if: always()
        run: node scripts/update-ausbildung.mjs
      # always commit what was written (failed jobs keep yesterday's data); a red step above still e-mails the owner
      - name: Commit data
        if: always()
        run: |
          git config user.name "danrc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
