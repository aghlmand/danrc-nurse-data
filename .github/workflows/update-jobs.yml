name: Update jobs data (/jobs)

on:
  workflow_run:            # chained: starts as soon as the nurse update finishes
    workflows: ["Update nurse data (/nurse)"]
    types: [completed]
  schedule:
    - cron: '37 1 * * *'   # backup 05:07 Tehran - runs only if today's data is missing
    - cron: '37 4 * * *'   # backup 08:07 Tehran
    - cron: '11 23 * * *'  # backup 02:41 Tehran
    - cron: '3 3 * * *'    # backup 06:33 Tehran
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip if today's data already exists (manual runs always update)
        id: chk
        run: |
          TODAY=$(TZ=Asia/Tehran date +%F)
          DAY=$(node -e "try{console.log(require('./data/jobs/summary.json').day||'')}catch(e){console.log('')}")
          echo "today=$TODAY data=$DAY event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$DAY" = "$TODAY" ]; then echo "skip=true" >> $GITHUB_OUTPUT; echo "Already updated today - skipping"; else echo "skip=false" >> $GITHUB_OUTPUT; fi
      - name: Jobs data
        if: steps.chk.outputs.skip != 'true'
        run: node scripts/update-jobs.mjs
      - name: Salary sample (stated salaries in new ads)
        if: always() && steps.chk.outputs.skip != 'true'
        run: node scripts/salary.mjs jobs
      - name: Daily statistics
        if: always() && steps.chk.outputs.skip != 'true'
        run: node scripts/stats.mjs jobs
      # always commit what was written (failed items keep yesterday's data); a red step above still e-mails the owner
      - name: Commit data
        if: always() && steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "danrc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "jobs data: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 15; done
