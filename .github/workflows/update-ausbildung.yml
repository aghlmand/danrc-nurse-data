name: Update Ausbildung data (/ausbildung)

on:
  workflow_run:            # chained: starts as soon as the jobs update finishes
    workflows: ["Update jobs data (/jobs)"]
    types: [completed]
  schedule:
    - cron: '27 2 * * *'   # backup 05:57 Tehran - runs only if today's data is missing
    - cron: '27 5 * * *'   # backup 08:57 Tehran
    - cron: '31 23 * * *'  # backup 03:01 Tehran
    - cron: '33 3 * * *'   # backup 07:03 Tehran
    - cron: '1 5 * * *'    # backup 08:31 Tehran
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip if today's data already exists (manual runs always update)
        id: chk
        run: |
          TODAY=$(TZ=Asia/Tehran date +%F)
          DAY=$(node -e "try{console.log(require('./data/ausbildung/summary.json').day||'')}catch(e){console.log('')}")
          echo "today=$TODAY data=$DAY event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$DAY" = "$TODAY" ]; then echo "skip=true" >> $GITHUB_OUTPUT; echo "Already updated today - skipping"; else echo "skip=false" >> $GITHUB_OUTPUT; fi
      - name: Ausbildung data
        if: steps.chk.outputs.skip != 'true'
        run: node scripts/update-ausbildung.mjs
      - name: Salary sample (stated salaries in new ads)
        if: always() && steps.chk.outputs.skip != 'true'
        run: node scripts/salary.mjs ausbildung
      - name: Daily statistics
        if: always() && steps.chk.outputs.skip != 'true'
        run: node scripts/stats.mjs ausbildung
      # always commit what was written (failed items keep yesterday's data); a red step above still e-mails the owner
      - name: Commit data
        if: always() && steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "danrc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ausbildung data: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 15; done
